<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>EMOJI CAPTURE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --shell-dark:#241a35;
    --shell-mid:#3a2a56;
    --shell-light:#523d78;
    --shell-edge:#150f20;
    --screen-bg:#140c1f;
    --accent:#ffb703;
    --accent-soft:#ffd166;
    --mint:#06d6a0;
    --danger:#ef476f;
    --ink:#f4f1ea;
    --ink-dim:#c9c1e0;
    --comum:#9ca3af;
    --incomum:#4cc9f0;
    --raro:#ffd166;
    --pixel-font:'Press Start 2P', monospace;
    --body-font:'Nunito', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:radial-gradient(ellipse at 50% 0%, #2c1f45 0%, #0c0714 70%);
    font-family:var(--body-font);
    color:var(--ink);
    overflow:hidden;
    overscroll-behavior:none;
    user-select:none;
  }
  #app{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:10px;
  }
  .gba-container{
    background:linear-gradient(160deg, var(--shell-light), var(--shell-dark) 60%, var(--shell-edge));
    border-radius:28px;
    padding:18px 18px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.08);
    width:100%; height:100%;
    max-width:920px; max-height:680px;
    display:flex; flex-direction:column;
    position:relative;
  }
  .shell-top-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 6px 10px;
    flex-shrink:0;
  }
  .shell-logo{
    font-family:var(--pixel-font);
    font-size:11px;
    color:var(--accent-soft);
    letter-spacing:1px;
    cursor:pointer;
    text-shadow:0 0 8px rgba(255,183,3,.6);
  }
  .shell-dot{width:8px;height:8px;border-radius:50%;background:var(--mint); box-shadow:0 0 6px var(--mint); margin-left:8px; display:inline-block;}
  .screen-border{
    flex:1;
    background:linear-gradient(145deg, var(--shell-edge), #1b1229);
    border-radius:18px;
    padding:12px;
    box-shadow:inset 0 4px 14px rgba(0,0,0,.7);
    min-height:0;
  }
  .game-screen{
    position:relative;
    width:100%; height:100%;
    background:var(--screen-bg);
    border-radius:10px;
    overflow:hidden;
    box-shadow:inset 0 0 40px rgba(0,0,0,.8), 0 0 24px rgba(120,90,200,.15);
    display:flex; flex-direction:column;
  }

  /* ---- TOPBAR ---- */
  .topbar{
    flex-shrink:0;
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    padding:8px 8px;
    background:rgba(0,0,0,.35);
    border-bottom:2px solid rgba(255,255,255,.06);
    position:relative; z-index:30;
  }
  .topbar button{
    font-family:var(--pixel-font);
    font-size:9px;
    color:var(--ink);
    background:linear-gradient(180deg,var(--shell-light),var(--shell-mid));
    border:2px solid rgba(0,0,0,.35);
    border-radius:6px;
    padding:7px 8px;
    cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,.4);
    transition:transform .1s;
    white-space:nowrap;
  }
  .topbar button:active{ transform:translateY(2px); box-shadow:0 0 0 rgba(0,0,0,.4); }
  .topbar button.sound-off{ opacity:.6; }
  #btnDebug.hidden, .hidden{ display:none !important; }
  .topbar-spacer{flex:1;}

  /* ---- WORLD ---- */
  .world{
    position:relative;
    flex:1;
    min-height:0;
    overflow:hidden;
  }
  .biome-layer{
    position:absolute; inset:0;
    opacity:0;
    transition:opacity 2.2s ease;
  }
  .biome-layer.active{ opacity:1; }
  #biome-campo{ background:
      radial-gradient(circle at 20% 80%, rgba(255,255,255,.08), transparent 40%),
      linear-gradient(180deg,#bde4a7 0%,#8fce6a 45%,#5fa649 100%); }
  #biome-floresta{ background:
      radial-gradient(circle at 70% 20%, rgba(120,80,200,.15), transparent 50%),
      linear-gradient(180deg,#0c1f14 0%,#132a1c 45%,#0a1810 100%); }
  #biome-montanhas{ background:
      radial-gradient(circle at 30% 15%, rgba(255,255,255,.25), transparent 45%),
      linear-gradient(180deg,#cfe8f7 0%,#8fb9d6 45%,#5b7fa0 100%); }
  #biome-fazenda{ background:
      radial-gradient(circle at 80% 80%, rgba(255,220,150,.15), transparent 45%),
      linear-gradient(180deg,#f6d98b 0%,#d8a857 45%,#a9793a 100%); }

  .tree{
    position:absolute;
    font-size:clamp(1.4rem, 4vw, 2.4rem);
    transform-origin:bottom center;
    animation:sway 3.5s ease-in-out infinite;
    pointer-events:none;
    filter:drop-shadow(0 4px 3px rgba(0,0,0,.35));
    z-index:5;
  }
  @keyframes sway{
    0%,100%{ transform:rotate(-4deg); }
    50%{ transform:rotate(4deg); }
  }

  .world-emoji{
    position:absolute;
    font-size:clamp(1.8rem, 6vw, 3rem);
    transform:translate(-50%,-50%);
    cursor:pointer;
    z-index:10;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));
    transition:filter .2s;
    animation:bob 2s ease-in-out infinite;
    line-height:1;
  }
  .world-emoji.rare-glow{
    filter:drop-shadow(0 0 10px var(--raro)) drop-shadow(0 0 18px var(--raro));
  }
  .world-emoji.uncommon-glow{
    filter:drop-shadow(0 0 8px var(--incomum));
  }
  @keyframes bob{
    0%,100%{ margin-top:0; }
    50%{ margin-top:-6px; }
  }

  /* ---- OVERLAYS ---- */
  .overlay{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,6,18,.97), rgba(20,12,31,.99));
    z-index:50;
    display:flex; flex-direction:column;
    padding:14px;
    overflow:hidden;
  }
  .overlay-header{
    display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0;
    margin-bottom:10px;
  }
  .overlay-title{
    font-family:var(--pixel-font);
    font-size:13px;
    color:var(--accent-soft);
    text-shadow:0 0 8px rgba(255,183,3,.5);
  }
  .btn-close{
    font-family:var(--pixel-font);
    background:var(--danger);
    color:#fff; border:none; border-radius:6px;
    padding:8px 10px; cursor:pointer; font-size:11px;
    box-shadow:0 2px 0 rgba(0,0,0,.4);
  }
  .btn-close:active{ transform:translateY(2px); box-shadow:none; }
  .overlay-body{ flex:1; min-height:0; overflow-y:auto; padding-right:2px; }

  .pixel-btn{
    font-family:var(--pixel-font);
    font-size:10px;
    color:var(--ink);
    background:linear-gradient(180deg,var(--shell-light),var(--shell-mid));
    border:2px solid rgba(0,0,0,.35);
    border-radius:8px;
    padding:10px 14px;
    cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.4);
  }
  .pixel-btn:active{ transform:translateY(3px); box-shadow:none; }
  .pixel-btn.primary{ background:linear-gradient(180deg, var(--accent-soft), var(--accent)); color:#3a2200; }
  .pixel-btn.mint{ background:linear-gradient(180deg,#6fe3bd,var(--mint)); color:#003d2e;}
  .pixel-btn.danger{ background:linear-gradient(180deg,#f47a95,var(--danger)); color:#3a0011;}
  .pixel-btn:disabled{ opacity:.4; cursor:not-allowed; }

  /* Capture screen */
  #captureScreen{ align-items:center; justify-content:center; text-align:center; }
  .capture-emoji{
    font-size:clamp(4rem,18vw,7rem);
    filter:drop-shadow(0 0 20px rgba(255,183,3,.5));
    animation:capturePulse .6s ease-in-out infinite;
  }
  @keyframes capturePulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.08); }
  }
  .capture-name{ font-family:var(--pixel-font); font-size:12px; margin:12px 0 4px; color:var(--ink-dim); }
  .progress-track{
    width:min(80vw,340px); height:22px;
    background:rgba(255,255,255,.1);
    border:2px solid rgba(255,255,255,.2);
    border-radius:11px;
    overflow:hidden;
    margin:10px auto;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent-soft));
    transition:width .08s linear;
  }
  .progress-label{ font-family:var(--pixel-font); font-size:9px; color:var(--ink-dim); margin-bottom:6px;}
  .capture-hint{ font-family:var(--pixel-font); font-size:9px; color:var(--mint); margin-top:14px; animation:blink 1.2s infinite; }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  #captureTapZone{ position:absolute; inset:0; }

  /* Result screen */
  #resultScreen{ align-items:center; justify-content:center; text-align:center; }
  .result-title{ font-family:var(--pixel-font); font-size:16px; color:var(--mint); text-shadow:0 0 10px rgba(6,214,160,.6); margin-bottom:14px;}
  .result-emoji{ font-size:clamp(4rem,18vw,7rem); }
  .result-name{ font-family:var(--pixel-font); font-size:12px; margin:14px 0 4px; }
  .result-total{ font-family:var(--body-font); font-weight:800; color:var(--ink-dim); margin-bottom:20px; }

  /* Dex grid */
  .dex-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(78px,1fr));
    gap:8px;
  }
  .dex-cell{
    background:rgba(255,255,255,.05);
    border:2px solid rgba(255,255,255,.08);
    border-radius:10px;
    padding:8px 4px;
    text-align:center;
    cursor:pointer;
  }
  .dex-cell .e{ font-size:1.8rem; display:block; }
  .dex-cell .n{ font-family:var(--pixel-font); font-size:7px; display:block; margin-top:6px; color:var(--ink-dim); line-height:1.3;}
  .dex-cell.locked{ opacity:.35; cursor:default; }
  .dex-cell.depleted{ opacity:.5; filter:grayscale(.6); }
  .dex-cell.rare{ border-color:var(--raro); box-shadow:0 0 10px rgba(255,209,102,.35); }
  .dex-cell.uncommon{ border-color:var(--incomum); }

  /* Detail screen */
  #detailScreen{ align-items:center; justify-content:center; text-align:center; }
  .detail-emoji{ font-size:clamp(4rem,16vw,6rem); }
  .detail-emoji.rare-glow{ filter:drop-shadow(0 0 16px var(--raro)) drop-shadow(0 0 26px var(--raro)); }
  .detail-name{ font-family:var(--pixel-font); font-size:13px; margin:12px 0 8px; }
  .detail-rarity{ font-family:var(--pixel-font); font-size:8px; padding:4px 8px; border-radius:12px; display:inline-block; margin-bottom:10px;}
  .detail-desc{ max-width:340px; margin:0 auto 12px; color:var(--ink-dim); line-height:1.5; }
  .detail-total{ font-weight:800; color:var(--accent-soft); }

  /* Trade */
  .trade-panels{ display:flex; gap:10px; justify-content:center; align-items:stretch; flex-wrap:wrap; margin-bottom:14px;}
  .trade-panel{
    background:rgba(255,255,255,.05);
    border:2px solid rgba(255,255,255,.08);
    border-radius:12px;
    padding:14px; width:150px; text-align:center;
  }
  .trade-panel h4{ font-family:var(--pixel-font); font-size:9px; margin:0 0 10px; color:var(--ink-dim); }
  .trade-slot{ font-size:2.6rem; min-height:52px; display:flex; align-items:center; justify-content:center; }
  .trade-status{ font-family:var(--pixel-font); font-size:8px; margin-top:8px; color:var(--mint); }
  .trade-emoji-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(56px,1fr)); gap:6px; margin-top:10px; }
  .trade-emoji-grid button{ background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.1); border-radius:8px; padding:6px; font-size:1.4rem; cursor:pointer; }
  .trade-emoji-grid button.selected{ border-color:var(--accent); box-shadow:0 0 8px rgba(255,183,3,.5); }
  .id-display{ font-family:var(--pixel-font); font-size:22px; letter-spacing:4px; color:var(--accent-soft); text-align:center; padding:14px; background:rgba(255,255,255,.06); border-radius:10px; margin:10px 0;}
  .field-row{ display:flex; gap:8px; justify-content:center; margin:10px 0; flex-wrap:wrap;}
  .field-row input{
    font-family:var(--pixel-font); font-size:14px; letter-spacing:3px; text-align:center;
    width:120px; padding:10px; border-radius:8px; border:2px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.06); color:var(--ink);
  }
  .role-choice{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:20px;}
  .role-card{
    background:rgba(255,255,255,.05); border:2px solid rgba(255,255,255,.1); border-radius:12px;
    padding:18px; width:150px; text-align:center; cursor:pointer;
  }
  .role-card:hover{ border-color:var(--accent); }
  .role-card .icon{ font-size:2.4rem; margin-bottom:8px; }
  .role-card .label{ font-family:var(--pixel-font); font-size:9px; }
  .conn-status{ text-align:center; font-family:var(--pixel-font); font-size:9px; color:var(--ink-dim); margin-top:10px;}

  /* Farm */
  .farm-slots-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
    max-width:280px; margin:0 auto 16px;
  }
  .farm-slot-box{
    background:rgba(255,255,255,.05); border:2px dashed rgba(255,255,255,.2); border-radius:12px;
    aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:2.6rem; cursor:pointer;
  }
  .farm-slot-box.filled{ border-style:solid; border-color:var(--accent); }
  .farm-visual{
    position:relative; flex:1; min-height:140px;
    background:linear-gradient(180deg,#f6d98b,#c99a52);
    border-radius:12px; overflow:hidden; margin-bottom:12px;
  }
  .farm-resident{
    position:absolute; font-size:clamp(1.6rem,5vw,2.6rem);
    transform:translate(-50%,-50%); cursor:pointer;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));
  }
  .farm-resident.rare-glow{ filter:drop-shadow(0 0 10px var(--raro)); }
  .farm-resident.reacting{ animation:reactPop .4s ease; }
  @keyframes reactPop{ 0%{transform:translate(-50%,-50%) scale(1);} 50%{transform:translate(-50%,-50%) scale(1.4) rotate(10deg);} 100%{transform:translate(-50%,-50%) scale(1);} }

  .center-col{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; }
  .muted{ color:var(--ink-dim); font-size:.9rem; }
  .rarity-tag-comum{ background:rgba(156,163,175,.25); color:var(--comum);}
  .rarity-tag-incomum{ background:rgba(76,201,240,.2); color:var(--incomum);}
  .rarity-tag-raro{ background:rgba(255,209,102,.25); color:var(--raro);}

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.15); border-radius:4px; }

  @media (max-width:520px){
    .gba-container{ border-radius:18px; padding:10px 10px 16px; }
    .screen-border{ border-radius:12px; padding:6px; }
    .topbar button{ font-size:8px; padding:6px; }
    .overlay-title{ font-size:11px; }
  }
  @media (orientation:landscape) and (max-height:480px){
    .shell-top-row{ display:none; }
    .gba-container{ padding:6px; border-radius:14px; }
    .screen-border{ padding:4px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="gba-container">
    <div class="shell-top-row">
      <div class="shell-logo" id="logoClick">EMOJI CAPTURE<span class="shell-dot"></span></div>
    </div>
    <div class="screen-border">
      <div class="game-screen" id="gameScreen">

        <div class="topbar">
          <button id="btnDex">📖 DEX</button>
          <button id="btnTrade">🔄 TROCAS</button>
          <button id="btnFarm">🌾 FAZENDA</button>
          <div class="topbar-spacer"></div>
          <button id="btnDebug" class="hidden">🐞 DEBUG</button>
          <button id="btnFull">⛶ FULL</button>
          <button id="btnSound">🔊</button>
        </div>

        <div class="world" id="world">
          <div class="biome-layer active" id="biome-campo"></div>
          <div class="biome-layer" id="biome-floresta"></div>
          <div class="biome-layer" id="biome-montanhas"></div>
          <div class="biome-layer" id="biome-fazenda"></div>
          <div id="treesLayer"></div>
          <div id="emojiLayer"></div>
        </div>

        <!-- CAPTURE -->
        <div class="overlay hidden" id="captureScreen">
          <div id="captureTapZone"></div>
          <div class="center-col" style="position:relative; z-index:2; pointer-events:none;">
            <div class="capture-emoji" id="captureEmojiChar">😊</div>
            <div class="capture-name" id="captureName">Feliz</div>
            <div class="progress-label" id="progressLabel">0 / 10</div>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <div class="capture-hint">CLIQUE RÁPIDO PARA CAPTURAR! OU SEGURE!</div>
          </div>
          <button class="btn-close" id="btnCancelCapture" style="position:absolute; top:14px; right:14px; z-index:3;">✕</button>
        </div>

        <!-- RESULT -->
        <div class="overlay hidden" id="resultScreen">
          <div class="center-col">
            <div class="result-title">Parabéns!</div>
            <div class="result-emoji" id="resultEmojiChar">😊</div>
            <div class="result-name" id="resultName">Você capturou: Feliz</div>
            <div class="result-total" id="resultTotal">Total: 1</div>
            <button class="pixel-btn primary" id="btnContinueResult">CONTINUAR</button>
          </div>
        </div>

        <!-- DEX -->
        <div class="overlay hidden" id="dexScreen">
          <div class="overlay-header">
            <div class="overlay-title">📖 DEX</div>
            <button class="btn-close" data-close="dexScreen">✕</button>
          </div>
          <div class="overlay-body"><div class="dex-grid" id="dexGrid"></div></div>
        </div>

        <!-- DETAIL -->
        <div class="overlay hidden" id="detailScreen">
          <div class="overlay-header">
            <div class="overlay-title">DETALHES</div>
            <button class="btn-close" data-close="detailScreen">✕</button>
          </div>
          <div class="overlay-body">
            <div class="center-col">
              <div class="detail-emoji" id="detailEmojiChar">😊</div>
              <div class="detail-name" id="detailName">Feliz</div>
              <div class="detail-rarity" id="detailRarity">comum</div>
              <div class="detail-desc" id="detailDesc">Descrição.</div>
              <div class="detail-total" id="detailTotal">Total possuído: 0</div>
            </div>
          </div>
        </div>

        <!-- TRADE -->
        <div class="overlay hidden" id="tradeScreen">
          <div class="overlay-header">
            <div class="overlay-title">🔄 TROCAS P2P</div>
            <button class="btn-close" data-close="tradeScreen">✕</button>
          </div>
          <div class="overlay-body" id="tradeBody"></div>
        </div>

        <!-- FARM -->
        <div class="overlay hidden" id="farmScreen">
          <div class="overlay-header">
            <div class="overlay-title">🌾 FAZENDA</div>
            <button class="btn-close" data-close="farmScreen">✕</button>
          </div>
          <div class="overlay-body">
            <div class="farm-visual" id="farmVisual"></div>
            <div class="center-col" style="height:auto;">
              <button class="pixel-btn primary" id="btnAddFarm">+ ADICIONAR</button>
            </div>
          </div>
        </div>

        <!-- FARM SLOT SELECT -->
        <div class="overlay hidden" id="farmSlotScreen">
          <div class="overlay-header">
            <div class="overlay-title">ESCOLHER SLOT</div>
            <button class="btn-close" data-close="farmSlotScreen">✕</button>
          </div>
          <div class="overlay-body">
            <div class="farm-slots-grid" id="farmSlotsGrid"></div>
          </div>
        </div>

        <!-- FARM EMOJI SELECT -->
        <div class="overlay hidden" id="farmEmojiScreen">
          <div class="overlay-header">
            <div class="overlay-title">ESCOLHER EMOJI</div>
            <button class="btn-close" data-close="farmEmojiScreen">✕</button>
          </div>
          <div class="overlay-body">
            <button class="pixel-btn danger" id="btnRemoveResident" style="margin-bottom:10px;">❌ REMOVER</button>
            <div class="dex-grid" id="farmEmojiGrid"></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
"use strict";

/* =========================================================
   1. DADOS DOS EMOJIS
   ========================================================= */
const emojiCategories = {
  "Expressões": [
    ["😀","Risada"],["😁","Sorriso Aberto"],["😂","Lágrimas de Rir"],["🤣","Rolando de Rir"],
    ["😊","Feliz"],["😍","Apaixonado"],["😘","Beijo"],["😜","Brincalhão"],["🤔","Pensativo"],
    ["😴","Sonolento"],["😎","Estiloso"],["🥳","Festeiro"],["😭","Chorão"],["😱","Assustado"],
    ["😡","Bravo"],["🥶","Congelado"],["🥵","Suando"],["🤯","Mente Explodida"]
  ],
  "Animais": [

let audioCtx = null;
function ensureAudio(){
  if (!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
}
function playTone(freq, duration){
  if (!gameState.isSoundOn) return;
  ensureAudio();
  if (!audioCtx) return;
  duration = duration || 0.15;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.value = freq;
  gain.gain.value = 0.05;
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
const sfx = {
  menu: ()=>playTone(440, 0.1),
  select: ()=>playTone(500, 0.1),
  interact: ()=>playTone(600, 0.08),
  confirm: ()=>playTone(750, 0.15),
  captureDone: ()=>playTone(880, 0.3)

   ========================================================= */
function pickEmojiData(){
  const activeIds = gameState.activeEmojis.map(a=>a.id);
  const neverCaptured = EMOJIS.filter(e=>!gameState.everCaptured[e.id] && !activeIds.includes(e.id));
  if (neverCaptured.length){
    return neverCaptured[Math.floor(Math.random()*neverCaptured.length)];
  }
  const fewCopies = EMOJIS.filter(e=>{
    const qty = gameState.capturedEmojis[e.id] || 0;
    return qty < 3 && !activeIds.includes(e.id);
  });
  if (fewCopies.length){
    return fewCopies[Math.floor(Math.random()*fewCopies.length)];
  }
  const anyAvailable = EMOJIS.filter(e=>!activeIds.includes(e.id));
  const pool = anyAvailable.length ? anyAvailable : EMOJIS;
  return pool[Math.floor(Math.random()*pool.length)];
}

let uidCounter = 1;
function spawnEmoji(){
  const data = pickEmojiData();
  const instance = {
    uid: uidCounter++,
    id: data.id,
    x: WORLD_MARGIN + Math.random()*(100-2*WORLD_MARGIN),
    y: 15 + Math.random()*70,
    dx: (Math.random()<0.5?-1:1) * (0.6 + Math.random()*0.8),
    dy: (Math.random()<0.5?-1:1) * (0.6 + Math.random()*0.8),
    speed: 6 + Math.random()*6, // % por segundo
    el: null
  };
  const el = document.createElement('div');
  el.className = 'world-emoji';
  if (data.rarity === 'raro') el.classList.add('rare-glow');
  else if (data.rarity === 'incomum') el.classList.add('uncommon-glow');
  el.textContent = data.emoji;
  el.style.left = instance.x + '%';
  el.style.top = instance.y + '%';
  el.addEventListener('pointerdown', (ev)=>{
    ev.stopPropagation();
    startCapture(instance);
  });
  dom.emojiLayer.appendChild(el);
  instance.el = el;
  gameState.activeEmojis.push(instance);
}

function maintainSpawns(){
  while (gameState.activeEmojis.length < MAX_ACTIVE_EMOJIS){
    spawnEmoji();
  }
}

function removeActiveEmoji(instance){
  const idx = gameState.activeEmojis.findIndex(a=>a.uid===instance.uid);
  if (idx>=0) gameState.activeEmojis.splice(idx,1);
  if (instance.el && instance.el.parentNode) instance.el.parentNode.removeChild(instance.el);
}

/* =========================================================
   8. MOVIMENTO
   ========================================================= */
let lastFrameTime = null;
function movementLoop(timestamp){
  if (lastFrameTime === null) lastFrameTime = timestamp;
  const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.1);
  lastFrameTime = timestamp;

  if (!dom.captureScreen.classList.contains('hidden')){
    // pausa movimento enquanto captura acontece
  } else {
    gameState.activeEmojis.forEach(inst=>{
      inst.x += inst.dx * inst.speed * dt;
      inst.y += inst.dy * inst.speed * dt;
      if (inst.x < WORLD_MARGIN){ inst.x = WORLD_MARGIN; inst.dx *= -1; }
      if (inst.x > 100-WORLD_MARGIN){ inst.x = 100-WORLD_MARGIN; inst.dx *= -1; }
      if (inst.y < 12){ inst.y = 12; inst.dy *= -1; }
      if (inst.y > 90){ inst.y = 90; inst.dy *= -1; }
      inst.el.style.left = inst.x + '%';
      inst.el.style.top = inst.y + '%';
    });
  }

  // residentes da fazenda também se movem sempre
  gameState.farmResidentElements.forEach(res=>{
    if (!res) return;
    res.x += res.dx * res.speed * dt;
    res.y += res.dy * res.speed * dt;
    if (res.x < 8){ res.x = 8; res.dx *= -1; }
    if (res.x > 92){ res.x = 92; res.dx *= -1; }
    if (res.y < 10){ res.y = 10; res.dy *= -1; }
    if (res.y > 88){ res.y = 88; res.dy *= -1; }
    if (res.el){
      res.el.style.left = res.x + '%';
      res.el.style.top = res.y + '%';
    }
  });

  requestAnimationFrame(movementLoop);
}

let holdInterval = null;
function startCapture(instance){
  const data = EMOJIS_BY_ID[instance.id];
  gameState.currentCapture = { instance, data, progress: 0, required: requiredTaps(data.rarity) };
  dom.captureEmojiChar.textContent = data.emoji;
  dom.captureName.textContent = data.name;
  updateProgressUI();
  showOverlay(dom.captureScreen);
  sfx.select();
}

function updateProgressUI(){
  const c = gameState.currentCapture;
  if (!c) return;
  const pct = Math.min(100, (c.progress / c.required) * 100);
  dom.progressFill.style.width = pct + '%';
  dom.progressLabel.textContent = Math.min(c.progress,c.required) + ' / ' + c.required;
}

function addCaptureProgress(amount){
  const c = gameState.currentCapture;
  if (!c) return;
  c.progress += amount;
  updateProgressUI();
  if (c.progress >= c.required){
    finishCapture();
  }
}

function finishCapture(){
  const c = gameState.currentCapture;
  if (!c) return;
  const id = c.data.id;
  gameState.capturedEmojis[id] = (gameState.capturedEmojis[id] || 0) + 1;
  gameState.everCaptured[id] = true;
  gameState.totalCaptures++;
  saveGame();
  removeActiveEmoji(c.instance);
  sfx.captureDone();

  dom.resultEmojiChar.textContent = c.data.emoji;
  dom.resultName.textContent = 'Você capturou: ' + c.data.name;
  dom.resultTotal.textContent = 'Total: ' + gameState.capturedEmojis[id];

  hideOverlay(dom.captureScreen);
  showOverlay(dom.resultScreen);
  gameState.currentCapture = null;
  clearHold();
}

function clearHold(){
  if (holdInterval){ clearInterval(holdInterval); holdInterval = null; }
}

function cancelCapture(){
  clearHold();
  gameState.currentCapture = null;
  hideOverlay(dom.captureScreen);
  sfx.menu();
}

function reactResident(el){
  el.classList.remove('reacting');
  void el.offsetWidth;
  el.classList.add('reacting');
  sfx.interact();
}

function renderFarmSlotScreen(){
  dom.farmSlotsGrid.innerHTML = '';
  gameState.farmResidents.forEach((id, slot)=>{
    const box = document.createElement('div');
    box.className = 'farm-slot-box' + (id!==null ? ' filled' : '');
    box.textContent = id!==null ? EMOJIS_BY_ID[id].emoji : '?';
    box.addEventListener('click', ()=>{
      pendingFarmSlot = slot;
      sfx.select();
      openFarmEmojiScreen();
    });
    dom.farmSlotsGrid.appendChild(box);
  });
}

function openFarmEmojiScreen(){
  dom.farmEmojiGrid.innerHTML = '';
  const currentOccupant = gameState.farmResidents[pendingFarmSlot];
  dom.btnRemoveResident.classList.toggle('hidden', currentOccupant === null);

  const owned = EMOJIS.filter(e=>{
    if (isDebugMode) return true;
    return (gameState.capturedEmojis[e.id]||0) > 0;
  });

  if (!owned.length){
    const msg = document.createElement('div');
    msg.className = 'muted';
    msg.textContent = 'Você ainda não possui emojis para colocar na fazenda.';
    dom.farmEmojiGrid.appendChild(msg);
  }

  owned.forEach(e=>{
    const qty = isDebugMode ? '∞' : (gameState.capturedEmojis[e.id]||0);
    const cell = document.createElement('div');
    cell.className = 'dex-cell';
    if (e.rarity==='raro') cell.classList.add('rare');
    cell.innerHTML = '<span class="e">'+e.emoji+'</span><span class="n">'+e.name+' ('+qty+')</span>';
    cell.addEventListener('click', ()=>assignResidentToSlot(e.id));
    dom.farmEmojiGrid.appendChild(cell);
  });

  showOverlay(dom.farmEmojiScreen);
}

function assignResidentToSlot(emojiId){
  const slot = pendingFarmSlot;
  if (slot === null) return;
  const previous = gameState.farmResidents[slot];

  if (previous !== null && !isDebugMode){
    gameState.capturedEmojis[previous] = (gameState.capturedEmojis[previous]||0) + 1;
  }
  if (!isDebugMode){
    gameState.capturedEmojis[emojiId] = Math.max(0,(gameState.capturedEmojis[emojiId]||0) - 1);
  }
  gameState.farmResidents[slot] = emojiId;
  gameState.everCaptured[emojiId] = true;
  saveGame();
  sfx.confirm();
  renderFarm();
  hideOverlay(dom.farmEmojiScreen);
  hideOverlay(dom.farmSlotScreen);
  showOverlay(dom.farmScreen);
}

function removeResidentFromSlot(){
  const slot = pendingFarmSlot;
  if (slot === null) return;
  const current = gameState.farmResidents[slot];
  if (current !== null){
    if (!isDebugMode){
      gameState.capturedEmojis[current] = (gameState.capturedEmojis[current]||0) + 1;
    }
    gameState.farmResidents[slot] = null;
    saveGame();
    sfx.menu();
    renderFarm();
  }
  hideOverlay(dom.farmEmojiScreen);
  hideOverlay(dom.farmSlotScreen);
  showOverlay(dom.farmScreen);
}

/* =========================================================
   12. TROCAS P2P
   ========================================================= */
function generateShortId(){
  return String(Math.floor(1000 + Math.random()*9000));
}

function renderTradeHome(){
  dom.tradeBody.innerHTML =
    '<div class="role-choice">' +
      '<div class="role-card" id="roleHost"><div class="icon">🛖</div><div class="label">HOST<br>(CRIAR SALA)</div></div>' +
      '<div class="role-card" id="roleClient"><div class="icon">🔌</div><div class="label">CLIENTE<br>(ENTRAR NA SALA)</div></div>' +
    '</div>';
  document.getElementById('roleHost').addEventListener('click', startAsHost);
  document.getElementById('roleClient').addEventListener('click', renderClientJoinForm);
}

function destroyPeer(){
  if (conn){ try{ conn.close(); }catch(e){} conn = null; }
  if (peer){ try{ peer.destroy(); }catch(e){} peer = null; }
  isHost = false;
  resetTradeSelectionState();
}

function startAsHost(attemptsLeft){
  attemptsLeft = attemptsLeft === undefined ? 5 : attemptsLeft;
  if (typeof Peer === 'undefined'){
    dom.tradeBody.innerHTML = '<div class="conn-status">Não foi possível carregar o sistema de conexão P2P. Verifique sua internet.</div>';
    return;
  }
  const id = generateShortId();
  dom.tradeBody.innerHTML = '<div class="conn-status">Criando sala...</div>';
  peer = new Peer('ec-' + id);
  isHost = true;

  peer.on('open', function(){
    dom.tradeBody.innerHTML =
      '<div class="center-col">' +
        '<div class="muted">Compartilhe este código com o outro jogador:</div>' +
        '<div class="id-display">'+id+'</div>' +
        '<div class="conn-status" id="hostStatus">Aguardando conexão...</div>' +
      '</div>';
  });

  peer.on('connection', function(c){
    conn = c;
    setupConnectionHandlers();
    conn.on('open', function(){
      renderTradeSession();
    });
  });

  peer.on('error', function(err){
    if (err && err.type === 'unavailable-id' && attemptsLeft > 0){
      startAsHost(attemptsLeft - 1);
    } else {
      dom.tradeBody.innerHTML = '<div class="conn-status">Erro na conexão. Tente novamente.</div>';
    }
  });
}

function renderClientJoinForm(){
  dom.tradeBody.innerHTML =
    '<div class="center-col">' +
      '<div class="muted">Digite o código da sala:</div>' +
      '<div class="field-row"><input type="text" id="clientIdInput" maxlength="4" placeholder="0000"></div>' +
      '<button class="pixel-btn primary" id="btnConnectClient">CONECTAR</button>' +
      '<div class="conn-status" id="clientStatus"></div>' +
    '</div>';
  document.getElementById('btnConnectClient').addEventListener('click', connectAsClient);
}

function connectAsClient(){
  const input = document.getElementById('clientIdInput');
  const code = (input.value || '').trim();
  const statusEl = document.getElementById('clientStatus');
  if (code.length < 4){
    statusEl.textContent = 'Digite um código válido de 4 dígitos.';
    return;
  }
  if (typeof Peer === 'undefined'){
    statusEl.textContent = 'Sistema de conexão P2P indisponível.';
    return;
  }
  statusEl.textContent = 'Conectando...';
  isHost = false;
  peer = new Peer();
  peer.on('open', function(){
    conn = peer.connect('ec-' + code);
    setupConnectionHandlers();
    conn.on('open', function(){
      renderTradeSession();
    });
  });
  peer.on('error', function(){
    statusEl.textContent = 'Não foi possível conectar. Verifique o código.';
  });
}

function setupConnectionHandlers(){
  conn.on('data', function(msg){
    handleTradeMessage(msg);
  });
  conn.on('close', function(){
    dom.tradeBody.innerHTML = '<div class="conn-status">Conexão encerrada.</div>';
    resetTradeSelectionState();
  });
}

function resetTradeSelectionState(){
  localPlayerEmoji = null;
  remotePlayerEmoji = null;
  localTradeConfirmed = false;
  remoteTradeConfirmed = false;
  tradeInProgress = false;
}

function renderTradeSession(){
  resetTradeSelectionState();
  dom.tradeBody.innerHTML =
    '<div class="trade-panels">' +
      '<div class="trade-panel"><h4>VOCÊ</h4><div class="trade-slot" id="localSlot">?</div><div class="trade-status" id="localStatus"></div></div>' +
      '<div class="trade-panel"><h4>OPONENTE</h4><div class="trade-slot" id="remoteSlot">?</div><div class="trade-status" id="remoteStatus"></div></div>' +
    '</div>' +
    '<div class="center-col" style="height:auto; gap:8px;">' +
      '<button class="pixel-btn mint" id="btnConfirmTrade" disabled>CONFIRMAR</button>' +
      '<button class="pixel-btn danger" id="btnCancelTrade">CANCELAR TROCA</button>' +
    '</div>' +
    '<div class="muted" style="text-align:center; margin:10px 0;">Escolha um emoji do seu inventário:</div>' +
    '<div class="trade-emoji-grid" id="tradeEmojiGrid"></div>';

  const grid = document.getElementById('tradeEmojiGrid');
  const owned = EMOJIS.filter(e=> isDebugMode || (gameState.capturedEmojis[e.id]||0) > 0);
  owned.forEach(e=>{
    const btn = document.createElement('button');
    btn.textContent = e.emoji;
    btn.title = e.name;
    btn.addEventListener('click', ()=>{
      localPlayerEmoji = e.id;
      Array.from(grid.children).forEach(c=>c.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('localSlot').textContent = e.emoji;
      document.getElementById('btnConfirmTrade').disabled = false;
      sendTradeMessage({type:'trade_selection', emojiId:e.id});
      sfx.select();
    });
    grid.appendChild(btn);
  });

  document.getElementById('btnConfirmTrade').addEventListener('click', function(){
    if (!localPlayerEmoji) return;
    localTradeConfirmed = true;
    document.getElementById('localStatus').textContent = 'CONFIRMADO ✓';
    this.disabled = true;
    sendTradeMessage({type:'trade_confirmed'});
    sfx.confirm();
    tryCompleteTrade();
  });

  document.getElementById('btnCancelTrade').addEventListener('click', function(){
    sendTradeMessage({type:'trade_aborted'});
    resetTradeSelectionState();
    renderTradeSession();
    sfx.menu();
  });
}

function sendTradeMessage(msg){
  if (conn && conn.open) conn.send(msg);
}

function handleTradeMessage(msg){
  if (!msg || !msg.type) return;
  if (msg.type === 'trade_selection'){
    remotePlayerEmoji = msg.emojiId;
    const remoteSlot = document.getElementById('remoteSlot');
    if (remoteSlot) remoteSlot.textContent = EMOJIS_BY_ID[msg.emojiId].emoji;
  } else if (msg.type === 'trade_confirmed'){
    remoteTradeConfirmed = true;
    const remoteStatus = document.getElementById('remoteStatus');
    if (remoteStatus) remoteStatus.textContent = 'CONFIRMADO ✓';
    tryCompleteTrade();
  } else if (msg.type === 'trade_completed'){
    // ack recebido, nada extra necessário
  } else if (msg.type === 'trade_aborted'){
    resetTradeSelectionState();
    renderTradeSession();
  }
}

function tryCompleteTrade(){
  if (tradeInProgress) return;
  if (localPlayerEmoji && remotePlayerEmoji && localTradeConfirmed && remoteTradeConfirmed){
    tradeInProgress = true;
    if (!isDebugMode){
      gameState.capturedEmojis[localPlayerEmoji] = Math.max(0,(gameState.capturedEmojis[localPlayerEmoji]||0) - 1);
    }
    gameState.capturedEmojis[remotePlayerEmoji] = (gameState.capturedEmojis[remotePlayerEmoji]||0) + 1;
    gameState.everCaptured[remotePlayerEmoji] = true;
    saveGame();
    sendTradeMessage({type:'trade_completed'});
    sfx.captureDone();
    const body = dom.tradeBody;
    const successMsg = document.createElement('div');
    successMsg.className = 'conn-status';
    successMsg.style.color = 'var(--mint)';
    successMsg.style.marginTop = '10px';
    successMsg.textContent = 'Troca concluída com sucesso! 🎉';
    body.appendChild(successMsg);
    setTimeout(function(){
      resetTradeSelectionState();
      renderTradeSession();
    }, 1800);
  }
}

/* =========================================================
   13. DEBUG
   ========================================================= */
function toggleDebugVisible(){
  logoClickCount++;
  clearTimeout(logoClickTimer);
  logoClickTimer = setTimeout(()=>{ logoClickCount = 0; }, 1500);
  if (logoClickCount >= 5){
    dom.btnDebug.classList.toggle('hidden');
    logoClickCount = 0;
  }
}
function toggleDebugMode(){
  isDebugMode = !isDebugMode;
  dom.btnDebug.style.outline = isDebugMode ? '2px solid var(--mint)' : 'none';
  sfx.confirm();
}

/* =========================================================
   14. EVENT LISTENERS
   ========================================================= */
function showOverlay(el){ el.classList.remove('hidden'); }
function hideOverlay(el){ el.classList.add('hidden'); }

function setupEventListeners(){
  dom.logoClick.addEventListener('click', toggleDebugVisible);
  dom.btnDebug.addEventListener('click', toggleDebugMode);

  dom.btnDex.addEventListener('click', ()=>{ sfx.menu(); renderDex(); showOverlay(dom.dexScreen); });
  dom.btnTrade.addEventListener('click', ()=>{ sfx.menu(); renderTradeHome(); showOverlay(dom.tradeScreen); });
  dom.btnFarm.addEventListener('click', ()=>{ sfx.menu(); renderFarm(); showOverlay(dom.farmScreen); });

 dom.btnFull.addEventListener('click', (ev) => {
    ev.preventDefault();
    sfx.menu();
    
    // Check fullscreen element using standard or vendor-prefixed properties
    const doc = window.document;
    const fullscreenElement = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement;

    if (!fullscreenElement) {
      const docEl = document.documentElement;
      const requestMethod = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      
      if (requestMethod) {
        requestMethod.call(docEl).catch((err) => {
          console.warn("Fullscreen request failed:", err);
        });
      }
    } else {
      const exitMethod = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen || doc.msExitFullscreen;
      
      if (exitMethod) {
        exitMethod.call(doc).catch((err) => {
          console.warn("Exit fullscreen failed:", err);
        });
      }
    }
  });
  dom.btnSound.addEventListener('click', ()=>{
    gameState.isSoundOn = !gameState.isSoundOn;
    updateSoundButton();
    saveGame();
    sfx.menu();
  });

  document.querySelectorAll('[data-close]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = document.getElementById(btn.getAttribute('data-close'));
      hideOverlay(target);
      sfx.menu();
    });
  });

  // Captura: tap rápido + segurar
  dom.captureTapZone.addEventListener('pointerdown', ()=>{
    addCaptureProgress(2);
    sfx.interact();
    clearHold();
    holdInterval = setInterval(()=>{ addCaptureProgress(1); }, 100);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(evt=>{
    dom.captureTapZone.addEventListener(evt, clearHold);
  });
  dom.btnCancelCapture.addEventListener('click', cancelCapture);

  dom.btnContinueResult.addEventListener('click', ()=>{
    hideOverlay(dom.resultScreen);
    maintainSpawns();
    sfx.menu();
  });

  dom.btnAddFarm.addEventListener('click', ()=>{
    sfx.select();
    renderFarmSlotScreen();
    hideOverlay(dom.farmScreen);
    showOverlay(dom.farmSlotScreen);
  });

  dom.btnRemoveResident.addEventListener('click', removeResidentFromSlot);

  document.addEventListener('visibilitychange', ()=>{
    if (document.hidden) saveGame();
  });
  window.addEventListener('beforeunload', saveGame);
}

function updateSoundButton(){
  dom.btnSound.textContent = gameState.isSoundOn ? '🔊' : '🔇';
  dom.btnSound.classList.toggle('sound-off', !gameState.isSoundOn);
}

/* =========================================================
   15. INICIALIZAÇÃO
   ========================================================= */
function initGame(){
  loadGame();
  updateSoundButton();
  createTrees();
  setupEventListeners();
  startBiomeRotation();
  maintainSpawns();
  requestAnimationFrame(movementLoop);
}

window.addEventListener('load', initGame);

})();
</script>
